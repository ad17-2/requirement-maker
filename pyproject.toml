[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "requirement-maker"
version = "0.1.0"
description = "Convert audio/video recordings into comprehensive requirement documents"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
requirement-maker = "requirement_maker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/requirement_maker"]

[tool.pytest.ini_options]
markers = [
    "real_provider: opt-in tests that call real OpenAI and Anthropic APIs",
]
